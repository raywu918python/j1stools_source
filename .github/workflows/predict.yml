name: Predict

on:
  schedule:
    - cron: '0 5 * * *'  # 下午 13:00 CST
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    environment: j1s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install TA-Lib
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install && cd ..
          pip install TA-Lib
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Run predict
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
        run: python scripts/run_predict.py
