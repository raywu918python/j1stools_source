name: Update Margin

on:
  schedule:
    - cron: '0 17,19,21,23,1 * * *'  # 台灣 1:00~9:00 共5次（奇數小時）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    environment: j1s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Run margin updater
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/run_margin_update.py
