name: RFC IB MACD

on:
  # 暫停自動排程（原本平日台灣時間 17:00 自動跑），保留手動觸發
  # - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: j1s
    steps:
      - uses: actions/checkout@v5
      - name: Set cache key
        run: |
          echo "CACHE_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "CACHE_KEY=$(TZ=Asia/Taipei date +%Y-%m-%d-%H)" >> $GITHUB_ENV
      - name: Restore price data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            db/price/
            db/active_stocks/
            db/feature_cols/
          key: price-data-${{ env.CACHE_KEY }}
          restore-keys: |
            price-data-${{ env.CACHE_DATE }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install TA-Lib
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install && cd ..
          pip install TA-Lib
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Run predict
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INFO_PARQUET_PATH: db/info/info.parquet
          USE_IB_FEATURES: "true"
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
          SINOPAC_CA_B64: ${{ secrets.SINOPAC_CA_B64 }}
          SINOPAC_CA_PASSWD: ${{ secrets.SINOPAC_CA_PASSWD }}
          SINOPAC_PERSON_ID: ${{ secrets.SINOPAC_PERSON_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/run_rfc_predict.py
      - name: Run backtest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
          USE_IB_FEATURES: "true"
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
          SINOPAC_CA_B64: ${{ secrets.SINOPAC_CA_B64 }}
          SINOPAC_CA_PASSWD: ${{ secrets.SINOPAC_CA_PASSWD }}
          SINOPAC_PERSON_ID: ${{ secrets.SINOPAC_PERSON_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/run_rfc_backtest.py
