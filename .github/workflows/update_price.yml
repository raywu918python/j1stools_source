name: Update Price

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    environment: j1s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Run price updater
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
        run: python scripts/run_price_update.py
