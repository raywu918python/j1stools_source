name: Update Price

on:
  schedule:
    - cron: '0,15,30,45 4 * * *'  # 中午 12:00~12:45 CST，每15分鐘
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    environment: j1s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Run price updater
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
        run: python scripts/run_price_update.py
