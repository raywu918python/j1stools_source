name: Margin LGBM

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: j1s
    steps:
      - uses: actions/checkout@v5
      - name: Set cache key
        run: |
          echo "CACHE_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "CACHE_KEY=$(TZ=Asia/Taipei date +%Y-%m-%d-%H)" >> $GITHUB_ENV
      - name: Restore price data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            db/price/
            db/active_stocks/
            db/feature_cols/
          key: price-data-${{ env.CACHE_KEY }}
          restore-keys: |
            price-data-${{ env.CACHE_DATE }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install TA-Lib
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install && cd ..
          pip install TA-Lib
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Run predict
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
        run: python scripts/run_margin_lgbm_predict.py
      - name: Run backtest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
        run: python scripts/run_margin_lgbm_backtest.py
