name: Train W Bottom Model

# W 底＋拉回 特徵重訓，並和 C 模型比較門檻與持倉數；新模型只存成 artifact，不 push 回 HF
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: j1s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download retrained model
        uses: actions/download-artifact@v4
        with:
          name: rfc_macd_ib_6xx_nolook
          path: models/
          run-id: 39412104557
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install TA-Lib
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install && cd ..
          pip install TA-Lib
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Train and compare
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
          USE_IB_FEATURES: "true"
          PYTHONUNBUFFERED: "1"
        run: python scripts/train_w_bottom_model.py
      - name: Upload W bottom model
        uses: actions/upload-artifact@v4
        with:
          name: rfc_wbottom_ib
          path: models/rfc_wbottom_ib.joblib
          retention-days: 30
