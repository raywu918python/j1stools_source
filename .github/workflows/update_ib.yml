name: Update IB

on:
  schedule:
    - cron: '30 16,18,20,22,0 * * *'  # 台灣 0:30~8:30 共5次（偶數小時）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    environment: j1s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Run IB updater
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/run_ib_update.py
