name: Update IB

on:
  schedule:
    - cron: '0 17,19,21,23,1 * * *'  # 台灣 1:00~9:00 共5次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    environment: j1s
    steps:
      - uses: actions/checkout@v5
      - name: Set cache key
        run: echo "CACHE_KEY=$(TZ=Asia/Taipei date +%Y-%m-%d-%H)" >> $GITHUB_ENV && echo "CACHE_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: Cache IB data
        uses: actions/cache@v4
        with:
          path: |
            db/ib/
            db/ib_flags/
            db/active_stocks/
          key: ib-db-${{ env.CACHE_KEY }}
          restore-keys: |
            ib-db-${{ env.CACHE_DATE }}-
            ib-db-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements-cloud.txt
      - name: Run IB updater
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: raywu918python/j1s-data
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/run_ib_update.py
